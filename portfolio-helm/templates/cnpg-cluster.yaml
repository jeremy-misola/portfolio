{{- if .Values.cnpg.enabled -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: portfolio-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portfolio-helm.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}

  {{- with .Values.cnpg.postgresql }}
  postgresql:
    parameters:
      {{- toYaml .parameters | nindent 6 }}
  {{- end }}

  storage:
    size: {{ .Values.cnpg.storage.size }}
    storageClass: {{ .Values.cnpg.storage.storageClass }}

  {{- with .Values.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  primaryUpdateStrategy: {{ .Values.cnpg.primaryUpdateStrategy }}

  {{- with .Values.cnpg.monitoring }}
  monitoring:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.cnpg.bootstrap }}
  bootstrap:
    initdb:
      {{- toYaml .initdb | nindent 6 }}
  {{- end }}
{{- end }}