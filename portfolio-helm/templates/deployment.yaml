apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portfolio-helm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portfolio-helm.labels" . | nindent 4 }}
    app: frontend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "portfolio-helm.selectorLabels" . | nindent 6 }}
      app: frontend
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "portfolio-helm.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "portfolio-helm.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # Init container to wait for database
      initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        command: ['sh', '-c', 'until pg_isready -h {{ .Values.database.host }} -p {{ .Values.database.port }} -U {{ .Values.database.name }}; do echo waiting for database; sleep 2; done']
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.existingSecret.name }}
              key: {{ .Values.database.existingSecret.passwordKey }}

      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          # Database environment variables from CNPG cluster secret
          env:
          - name: DATABASE_HOST
            value: {{ .Values.database.host }}
          - name: DATABASE_PORT
            value: {{ .Values.database.port | quote }}
          - name: DATABASE_NAME
            value: {{ .Values.database.name }}
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.existingSecret.name }}
                key: {{ .Values.database.existingSecret.usernameKey }}
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.existingSecret.name }}
                key: {{ .Values.database.existingSecret.passwordKey }}

          # Admin credentials from ExternalSecret
          - name: ADMIN_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.adminSecrets.existingSecret.name }}
                key: {{ .Values.adminSecrets.existingSecret.usernameKey }}
          - name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.adminSecrets.existingSecret.name }}
                key: {{ .Values.adminSecrets.existingSecret.passwordKey }}
          - name: ADMIN_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.adminSecrets.existingSecret.name }}
                key: {{ .Values.adminSecrets.existingSecret.sessionSecretKey }}

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}